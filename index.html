<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#f6f5f2">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2227;--mut:#5d6670;--wood:#b8672b;--char:#363b41;--line:rgba(29,34,39,.12);--glass:rgba(255,255,255,.9);
--ok:#16854f;--okb:#dff3e8;--warn:#a96400;--warnb:#fdeccb;--bad:#c72f2f;--badb:#fbdede;--vac:#4f5a68;--vacb:#e6eaef}
*{box-sizing:border-box}
html{background:#2a2118}
body{margin:0;font-family:Manrope,system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:1020px;margin:0 auto;padding:16px}
.hero{min-height:230px;display:flex;flex-direction:column;justify-content:space-between;padding:6px 0 22px;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:8px;background:rgba(20,16,12,.45);backdrop-filter:blur(8px);padding:5px 6px 5px 14px;border-radius:99px;font-size:13px}
h1{font-size:clamp(28px,6vw,46px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.sub{margin:8px 0 0;font-size:15px;opacity:.92;text-shadow:0 1px 8px rgba(0,0,0,.5)}
h2{font-size:17px;margin:0 0 12px;font-weight:800}
.card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
button{font:inherit;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px;transition:background .15s,transform .1s}
button:hover{background:#f1ece6}button:active{transform:scale(.97)}
button.p{background:var(--wood);color:#fff;border-color:var(--wood)}button.p:hover{background:#9f5822}
button.s{padding:6px 11px;font-size:13px}
button.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);padding:5px 12px}button.ghost:hover{background:rgba(255,255,255,.18)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4a8fd6;outline-offset:2px}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--glass);backdrop-filter:blur(12px);border-radius:14px;padding:12px 14px;border-left:5px solid var(--char);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.stat b{font-size:24px;display:block;font-weight:800}.stat span{color:var(--mut);font-size:13px}
.stat.v{border-color:var(--vac)}.stat.o{border-color:var(--bad)}.stat.u{border-color:var(--wood)}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.paid{background:var(--okb);color:var(--ok)}.due,.unpaid{background:var(--warnb);color:var(--warn)}.overdue{background:var(--badb);color:var(--bad)}.vacant,.none{background:var(--vacb);color:var(--vac)}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.door{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.plate{background:var(--char);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;letter-spacing:.04em;border-bottom:4px solid var(--wood)}
.door.s-overdue .plate{border-color:var(--bad)}.door.s-paid .plate{border-color:var(--ok)}.door.s-vacant .plate{border-color:#9aa4b0}
.dbody{padding:12px 14px;flex:1;font-size:14px;line-height:1.7}.dbody .n{font-weight:700;font-size:15px}
.dact{display:flex;gap:6px;padding:0 14px 14px;flex-wrap:wrap}
.banner{border-radius:16px;padding:18px;margin-bottom:14px;font-weight:800;font-size:18px;box-shadow:0 10px 30px rgba(0,0,0,.22);border-left:8px solid}
.banner small{display:block;font-weight:500;font-size:14px;margin-top:5px}
.banner.overdue{border-color:var(--bad)}.banner.due,.banner.unpaid{border-color:var(--warn)}.banner.paid{border-color:var(--ok)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.info span{color:var(--mut);font-size:13px}
.note{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.note:last-child{border:0}
.mut{color:var(--mut);font-size:13px}.foot{color:#fff;opacity:.85;font-size:13px;text-shadow:0 1px 6px #000}
.err{color:var(--bad);font-size:13px;font-weight:700;margin-top:10px}
.login{max-width:390px;margin:0 auto 30px}
.modal{position:fixed;inset:0;background:rgba(15,12,9,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.on{display:flex}.modal .card{width:100%;max-width:430px;max-height:90vh;overflow:auto;margin:0;background:#fff}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);resize:vertical}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:#ece7e1;padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent}.tabs button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px}
.or{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 0}
.prev img,.idimg{display:block;width:100%;max-height:300px;object-fit:contain;background:#0001;border-radius:10px;margin-top:10px}
.idimg{max-height:340px}
.stat.p{border-color:var(--warn)}
.reg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.reg:last-child{border:0}.regr{display:flex;align-items:center;gap:8px}
.nav{display:flex;gap:6px;background:rgba(20,16,12,.55);backdrop-filter:blur(10px);padding:6px;border-radius:14px;margin-bottom:14px;position:sticky;top:8px;z-index:3}
.nav button{flex:1;background:transparent;color:#fff;border:0;display:flex;align-items:center;justify-content:center;gap:8px}
.nav button:hover{background:rgba(255,255,255,.14)}.nav button.on{background:#fff;color:var(--ink)}
.dot{background:var(--bad);color:#fff;border-radius:99px;font-size:12px;min-width:20px;padding:1px 6px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{padding:5px 12px;font-size:13px;border-radius:99px}
.chips button.on{background:var(--char);color:#fff;border-color:var(--char)}

/* icon nav */
.nav{align-items:center}
.nav button{position:relative;flex:1;min-height:44px;padding:8px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.nav button .dot{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;font-size:11px;line-height:16px;padding:0 5px}
.nav .sep{width:1px;align-self:stretch;margin:6px 2px;background:rgba(255,255,255,.25)}
.nav button.out{flex:0 0 52px;color:#ffb4b4}
.nav button.out:hover{background:rgba(199,47,47,.55);color:#fff}
.hero{min-height:170px;justify-content:flex-end}

.stat.g{border-color:var(--ok)}.stat small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.srch{position:relative}.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.srch input{padding-left:36px}
.mon{display:flex;gap:6px;align-items:center}.mon input{flex:1;min-width:0}.mon button{padding:8px 12px}
.tools .chips{margin:0}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:18px 0;font-size:14px}
.chat .log{height:min(55vh,430px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:#f1ede8;border-radius:12px;margin:10px 0}
.msg{max-width:85%;background:#fff;border-radius:12px;padding:8px 12px;align-self:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.msg.me{align-self:flex-end;background:#fbe8d6}.mh{display:flex;gap:8px;align-items:center;font-size:12px}
.ow{background:var(--wood);color:#fff;padding:1px 9px;border-radius:99px}
.mt{white-space:pre-wrap;word-break:break-word;font-size:14px;margin-top:3px}
.compose{display:flex;gap:8px;align-items:flex-end}.compose textarea{flex:1}
.x{border:0;background:none;padding:0 4px;font-size:16px;color:var(--mut)}

.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,18,12,.05) 0,rgba(24,18,12,.35) 38%,rgba(24,18,12,.82) 100%)}
.wrap{padding:20px 16px 56px}
.hero{min-height:210px;justify-content:space-between;padding:6px 0 22px;color:#fff}
h1{font-size:clamp(30px,5.5vw,44px);letter-spacing:-.035em;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.sub{color:#fff;opacity:.92;text-shadow:0 1px 8px rgba(0,0,0,.5)}.foot{color:#fff;text-shadow:0 1px 6px #000}
.card,.banner{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card{padding:20px}.banner{border-left-width:6px}
button{border-radius:12px;font-weight:600;transition:background .2s,transform .2s var(--ez),box-shadow .2s}
button:hover{background:#f1f0ec;transform:translateY(-1px)}button:active{transform:scale(.97)}
button.p{background:var(--ink);border-color:var(--ink);color:#fff}button.p:hover{background:#2c3038}
input,select,textarea{border-radius:12px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(22,24,29,.08)}
.nav{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--sh);border-radius:16px;gap:4px}
.nav button{color:var(--mut);border-radius:12px}.nav button:hover{background:#f1f0ec;color:var(--ink)}
.nav button.on{background:var(--ink);color:#fff}.nav .sep{background:var(--line)}
.nav button.out{color:var(--bad)}.nav button.out:hover{background:var(--badb);color:var(--bad)}
.stat,.stat.v,.stat.o,.stat.u,.stat.p,.stat.g{background:#fff;backdrop-filter:none;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);position:relative;padding:14px 16px;transition:transform .25s var(--ez),box-shadow .25s}
.stat:hover{transform:translateY(-2px)}.stat b{font-size:26px;letter-spacing:-.02em}
.stat::before{content:"";position:absolute;top:16px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.stat.v::before{background:var(--vac)}.stat.o::before{background:var(--bad)}.stat.u::before{background:var(--wood)}.stat.p::before{background:var(--warn)}.stat.g::before{background:var(--ok)}
.door{border-radius:16px;box-shadow:var(--sh);transition:transform .25s var(--ez),box-shadow .25s}
.door:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(22,24,29,.10)}
.plate{background:#fff;color:var(--ink);border-bottom-width:3px;font-size:17px}
.tabs,.chips button{background:#efeee9}.chips button{border-color:transparent}.chips button.on,.tabs button.on{color:#fff}
.tabs button.on{background:var(--ink)}.chat .log{background:#f6f5f2}.msg.me{background:#fdece0}
.modal{background:rgba(22,24,29,.45);backdrop-filter:blur(4px)}
.modal.on{animation:fade .2s}.modal.on .card{animation:pop .3s var(--ez)}
/* motion */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shim{to{background-position:-200% 0}}
.anim>*{animation:up .5s var(--ez) both}
.anim>*:nth-child(2){animation-delay:.06s}.anim>*:nth-child(3){animation-delay:.12s}.anim>*:nth-child(4){animation-delay:.18s}.anim>*:nth-child(n+5){animation-delay:.24s}
.anim .door,.anim .stat{animation:up .45s var(--ez) both}
.anim .door:nth-child(2),.anim .stat:nth-child(2){animation-delay:0.10s}.anim .door:nth-child(3),.anim .stat:nth-child(3){animation-delay:0.15s}.anim .door:nth-child(4),.anim .stat:nth-child(4){animation-delay:0.20s}.anim .door:nth-child(5),.anim .stat:nth-child(5){animation-delay:0.25s}.anim .door:nth-child(6),.anim .stat:nth-child(6){animation-delay:0.30s}.anim .door:nth-child(7),.anim .stat:nth-child(7){animation-delay:0.35s}.anim .door:nth-child(8),.anim .stat:nth-child(8){animation-delay:0.40s}
.skl{height:14px;border-radius:8px;margin:12px 0;background:linear-gradient(90deg,#eceae5 25%,#f6f5f2 50%,#eceae5 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
/* loading screen */
#loader{position:fixed;inset:0;z-index:99;background:var(--bgc);display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#loader.off{opacity:0;visibility:hidden}.ld{text-align:center}
.ldi{width:64px;height:64px;border-radius:20px;background:var(--ink);display:grid;place-items:center;margin:0 auto 16px;animation:float 1.6s ease-in-out infinite;box-shadow:0 14px 30px rgba(22,24,29,.25)}
.ldi svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ldn{font-weight:800;letter-spacing:-.02em;font-size:18px}
.ldb{width:120px;height:3px;border-radius:9px;background:#e4e2dc;margin:14px auto 0;overflow:hidden}
.ldb i{display:block;width:40%;height:100%;background:var(--wood);border-radius:9px;animation:bar 1.1s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('Could not read the file.'));
 r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Choose a JPG or PNG photo.'));
  im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   let q=.72,o;do{o=c.toDataURL('image/jpeg',q);q-=.1}while(o.length>900000&&q>.2);res(o)};im.src=r.result};r.readAsDataURL(file)})}
async function pickFile(el){const f=el.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>15e6){msg('Choose a JPG or PNG photo under 15 MB.');return}
 try{S.idData=await compress(f);msg('');$('#prev').innerHTML=`<img src="${S.idData}" alt="ID preview">`}catch(e){msg(e.message)}}

function tenantView(a){

 const m={paid:['Your rent is paid','Thank you. Next due date: '+fmt(a.due)],
  unpaid:['Rent payment upcoming',`${money(a.rent)} is due on ${fmt(a.due)} (in ${d} days).`],

  overdue:['Your rent is overdue',`${money(a.rent)} was due on ${fmt(a.due)}, ${-d} day${-d>1?'s':''} ago. Please pay as soon as possible.`]}[s];
 const n={overdue:`Overdue by ${-d} day(s): ${money(a.rent)}`,due:`Payment due ${d===0?'today':'in '+d+' day(s)'}: ${money(a.rent)}`,unpaid:`Upcoming payment on ${fmt(a.due)}`,paid:'Payment received. Nothing to do.'}[s];
 return`<div class="banner ${s}" style="background:var(--${s==='paid'?'okb':s==='overdue'?'badb':'warnb'})">${m[0]}<small>${m[1]}</small></div>
 <div class="card"><h2>Unit ${esc(a.unit)}</h2><div class="info"><div><span>Tenant</span><br><b>${esc(a.tenantName)}</b></div><div><span>Monthly rent</span><br><b>${money(a.rent)}</b></div><div><span>Due date</span><br><b>${fmt(a.due)}</b></div><div><span>Status</span><br>${badge(s)}</div></div></div>

function payHistory(a,s){
 const H={};
 Object.entries(a.payments||{}).forEach(([k,v])=>{const ym=k.slice(1,5)+'-'+k.slice(5);H[ym]={s:'paid',amt:Number(v)}});
 S.pays.forEach(p=>{H[p.month]={s:'paid',amt:Number(p.amount),at:p.paidAt?iso(new Date(ms(p.paidAt))):''}});
 const cur=(a.due||'').slice(0,7);
 if(cur&&!H[cur])H[cur]={s,amt:Number(a.rent)||0,due:a.due};
 const rows=Object.entries(H).sort((x,y)=>y[0].localeCompare(x[0]));
 const total=rows.filter(r=>r[1].s==='paid').reduce((t,r)=>t+r[1].amt,0);
 return`<div class="card"><div class="head"><h2 style="margin:0">Payment history</h2><span class="mut">Total paid: <b>${money(total)}</b></span></div>
 ${rows.map(([ym,r])=>`<div class="reg"><div><b>${monthLabel(ym)}</b>${r.at?`<br><span class="mut">Paid ${fmt(r.at)}</span>`:r.due?`<br><span class="mut">Due ${fmt(r.due)}</span>`:''}</div><div class="regr"><b>${money(r.amt)}</b>${badge(r.s)}</div></div>`).join('')||'<p class="mut" style="margin:0">No payments recorded yet.</p>'}
 <p class="mut" style="margin:10px 0 0">Payment records are permanent and cannot be changed.</p></div>`}

const setSt=k=>{S.st=k;paintUnits();document.querySelectorAll('#u_chips button').forEach(b=>b.classList.toggle('on',b.dataset.k===k))};
function paintUnits(){
 const rp=$('#u_reps');if(rp){const L=pendRep();rp.innerHTML=L.length?`<div class="card"><h2>Payment reports <span class="dot" style="position:static">${L.length}</span></h2>${L.map(r=>`<div class="reg"><div><b>Unit ${esc(r.unit)} · ${esc(r.tenantName)}</b><br><span class="mut">${money(r.amount)} for ${monthLabel(r.month)} · paid ${fmt(r.paidDate)}${r.ref?' · Ref '+esc(r.ref):''}</span></div><div class="regr"><button class="s p" onclick="approveRep('${r.id}')">Approve</button><button class="s" onclick="declineRep('${r.id}')">Decline</button></div></div>`).join('')}</div>`:''}
 const ss=$('#u_stats'),ll=$('#u_list');if(!ss||!ll)return;
 const A=S.units,ym=S.month,pend=S.users.filter(u=>u.status==='pending').length;
 const M=A.map(a=>({a,...mstat(a,ym)}));
 const sum=f=>M.filter(f).reduce((t,x)=>t+x.amt,0),cnt=f=>M.filter(f).length;
 const un=x=>x.s==='unpaid'||x.s==='due';
 ss.innerHTML=`<div class="stat g"><b>${money(sum(x=>x.s==='paid'))}</b><span>Income received</span><small>${monthLabel(ym)}</small></div>
 <div class="stat"><b>${cnt(x=>x.s==='paid')}</b><span>Paid units</span></div>
 <div class="stat u"><b>${cnt(un)}</b><span>Unpaid</span><small>${money(sum(un))}</small></div>
 <div class="stat o"><b>${cnt(x=>x.s==='overdue')}</b><span>Overdue</span><small>${money(sum(x=>x.s==='overdue'))}</small></div>
 <div class="stat v"><b>${cnt(x=>x.s==='vacant')}</b><span>Vacant</span><small>${A.length} total units</small></div>
 <div class="stat p"><b>${pend}</b><span>Waiting for review</span></div>`;
 const q=S.q.trim().toLowerCase();
 const list=M.filter(x=>{
  if(S.st==='unpaid'?!un(x):S.st!=='all'&&x.s!==S.st)return false;
  if(!q)return true;
  return[x.a.unit,x.a.tenantName,LABEL[x.s],x.a.rent,x.s==='due'?'unpaid':''].join(' ').toLowerCase().includes(q)});
 ll.innerHTML=list.length?list.map(({a,s})=>{const cur=(a.due||'').slice(0,7)===ym;return`<div class="door s-${s}"><div class="plate">${esc(a.unit)}${badge(s)}</div>
 <div class="dbody"><div class="n">${vacant(a)?'Empty unit':esc(a.tenantName)}</div>Rent ${money(a.rent)}<br>${vacant(a)?'Ready for a new tenant':s==='none'?'No bill for '+monthLabel(ym):s==='paid'&&!cur?'Paid for '+monthLabel(ym):'Due '+fmt(a.due)+(s==='overdue'?' · '+(-days(a))+' days late':'')}</div>
 <div class="dact">${(s==='unpaid'||s==='due'||s==='overdue')?`<button class="s p" onclick="markPaid('${a.id}')">Mark paid</button>`:''}<button class="s" onclick="edit('${a.id}')">Edit</button></div></div>`}).join(''):`<div class="empty">${A.length?'No units match your filter.':'Add your first unit to start billing.'}</div>`}
function unitsView(){
 const chip=(k,l)=>`<button data-k="${k}" class="${S.st===k?'on':''}" onclick="setSt('${k}')">${l}</button>`;
 return`<div id="u_reps"></div><div class="stats" id="u_stats"></div>
 <div class="card"><div class="head"><h2 style="margin:0">Units</h2><button class="p s" onclick="edit()">Add unit</button></div>
 <div class="tools">
  <div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="u_q" type="search" placeholder="Filter by unit, tenant or status…" autocomplete="off" value="${esc(S.q)}" oninput="setQ(this.value)" aria-label="Filter units"></div>
  <div class="mon"><button onclick="shiftMonth(-1)" aria-label="Previous month">‹</button><input id="u_month" type="month" value="${S.month}" onchange="setMonth(this.value)" aria-label="Select month"><button onclick="shiftMonth(1)" aria-label="Next month">›</button></div>
  <div class="chips" id="u_chips">${chip('all','All')}${chip('paid','Paid')}${chip('unpaid','Unpaid')}${chip('overdue','Overdue')}${chip('vacant','Vacant')}</div>
 </div>
 <div class="doors" id="u_list"></div></div>`}
const run=async f=>{try{await f()}catch(e){alert(fe(e))}};
const payDoc=(a,ym)=>({unitId:a.id,unit:a.unit,tenantUid:a.tenantUid,tenantName:a.tenantName,month:ym,amount:Number(a.rent)||0,paidAt:serverTimestamp(),by:S.user.uid});
const markPaid=id=>run(async()=>{const a=S.units.find(x=>x.id===id),ym=(a.due||'').slice(0,7);
 if(!confirm('Mark '+a.unit+' as paid for '+monthLabel(ym)+'?\nPayment records are permanent and cannot be edited or deleted.'))return;
 const b=writeBatch(db);b.update(doc(db,'units',id),{paid:true});
 if(!hasPay(id,ym))b.set(doc(db,'payments',payId(id,ym)),payDoc(a,ym));
 await b.commit()});
const pendRep=()=>S.reps.filter(r=>r.status==='pending');
function reportPay(){const a=S.unit;if(!a)return;
 openM(`<h2>Report payment</h2><p class="mut" style="margin-top:0">${esc(a.unit)} · ${monthLabel(a.due.slice(0,7))}</p>
 <label for="r_amt">Amount paid</label><input id="r_amt" type="number" min="1" value="${a.rent}">
 <label for="r_date">Date paid</label><input id="r_date" type="date" value="${iso(new Date())}" max="${iso(new Date())}">
 <label for="r_ref">Reference no. (optional)</label><input id="r_ref" maxlength="60" autocomplete="off">
 <div class="row"><button onclick="closeM()">Cancel</button><button class="p" onclick="submitReport()">Send to owner</button></div>`)}
const submitReport=()=>run(async()=>{const a=S.unit,ym=a.due.slice(0,7),id=payId(a.id,ym),amt=+$('#r_amt').value,dt=$('#r_date').value;
 if(!(amt>0)||!dt){alert('Enter the amount and the date you paid.');return}
 const f={amount:amt,paidDate:dt,ref:$('#r_ref').value.trim(),status:'pending',createdAt:serverTimestamp()};
 if(S.reps.some(x=>x.id===id))await updateDoc(doc(db,'paymentReports',id),{...f,reason:deleteField(),reviewedAt:deleteField()});
 else await setDoc(doc(db,'paymentReports',id),{unitId:a.id,unit:a.unit,tenantUid:S.user.uid,tenantName:a.tenantName,month:ym,...f});
 closeM()});
const approveRep=id=>run(async()=>{const r=S.reps.find(x=>x.id===id),a=S.units.find(x=>x.id===r.unitId);
 if(!a){alert('This unit no longer exists.');return}
 if(!confirm('Approve '+money(r.amount)+' from '+r.tenantName+' for '+monthLabel(r.month)+'?\nThis creates a permanent payment record.'))return;
 const b=writeBatch(db);
 b.update(doc(db,'paymentReports',id),{status:'approved',reviewedAt:serverTimestamp()});
 if(!hasPay(a.id,r.month))b.set(doc(db,'payments',payId(a.id,r.month)),payDoc({...a,rent:r.amount},r.month));
 if((a.due||'').slice(0,7)===r.month)b.update(doc(db,'units',a.id),{paid:true});
 await b.commit()});
const declineRep=id=>run(async()=>{const reason=prompt('Reason for declining (the tenant will see this):');if(reason===null)return;
 await updateDoc(doc(db,'paymentReports',id),{status:'declined',reason:reason.trim().slice(0,200),reviewedAt:serverTimestamp()})});
const closeM=()=>$('#modal').classList.remove('on');
const openM=h=>{$('#mbody').innerHTML=h;$('#modal').classList.add('on')};
async function review(uid){
 const u=S.users.find(x=>x.id===uid);if(!u)return;
 openM('<p>Loading ID…</p>');
 let img='';try{const d=await getDoc(doc(db,'ids',uid));img=d.exists()?d.data().image:''}catch(e){}
 const free=S.units.filter(a=>vacant(a)||a.tenantUid===uid);
 const head=`<h2>${esc(u.name)}</h2><div class="mut">${esc(u.email)} · ${esc(u.idType)} · ${LABEL[u.status]}</div>${img?`<img class="idimg" src="${img}" alt="Uploaded ID">`:'<p class="err">No ID image found.</p>'}`;
 if(u.status==='approved')return openM(head+`<p class="mut">This registration is approved, so it can't be declined. To change the apartment, use Edit on the unit.</p><div class="row"><button onclick="closeM()">Close</button></div>`);
 openM(head+(u.status==='declined'?`<p class="mut">Declined: ${esc(u.reason)}</p>`:'')+`
 <label for="r_unit">Assign apartment (optional)</label><select id="r_unit"><option value="">Assign later</option>${free.map(a=>`<option value="${a.id}">${esc(a.unit)}</option>`).join('')}</select>
 ${u.status==='pending'?`<label for="r_reason">Reason (required to decline)</label><textarea id="r_reason" rows="2" placeholder="e.g. ID photo is blurry or the name does not match"></textarea>`:''}
 <div class="err" id="rmsg"></div>
 <div class="row"><button onclick="closeM()">Close</button>${u.status==='pending'?`<button onclick="decline('${uid}')">Decline</button>`:''}<button class="p" onclick="approve('${uid}')">Approve</button></div>`)}
const approve=uid=>run(async()=>{const u=S.users.find(x=>x.id===uid),unit=$('#r_unit').value,b=writeBatch(db);
 b.update(doc(db,'users',uid),{status:'approved',reason:'',reviewedAt:serverTimestamp()});
 if(unit)b.update(doc(db,'units',unit),{tenantUid:uid,tenantName:u.name,paid:false});
 await b.commit();closeM()});
const decline=uid=>run(async()=>{if(S.users.find(x=>x.id===uid)?.status==='approved')return alert('Approved registrations cannot be declined.');const r=$('#r_reason').value.trim();if(!r){$('#rmsg').textContent='Write a reason so the tenant knows what to fix.';return}
 await updateDoc(doc(db,'users',uid),{status:'declined',reason:r,reviewedAt:serverTimestamp()});closeM()});
function edit(id){
 const a=S.units.find(x=>x.id===id)||{unit:'',rent:8000,due:off(30),paid:false,tenantUid:''};
 const ppl=S.users.filter(u=>u.status==='approved'&&(u.id===a.tenantUid||!S.units.some(x=>x.tenantUid===u.id)));
 openM(`<h2>${id?'Edit '+esc(a.unit):'Add unit'}</h2>
 <label for="f_unit">Unit name</label><input id="f_unit" value="${esc(a.unit)}" oninput="checkDup('${id||''}',this.value)" autocomplete="off"><div class="err" id="f_dup" style="margin:6px 0 0"></div>
 <label for="f_ten">Tenant</label><select id="f_ten"><option value="">Empty / vacant</option>${ppl.map(u=>`<option value="${u.id}" ${u.id===a.tenantUid?'selected':''}>${esc(u.name)}</option>`).join('')}</select>
 <label for="f_rent">Monthly rent</label><input id="f_rent" type="number" min="0" value="${a.rent}">
 <label for="f_due">Due date</label><input id="f_due" type="date" value="${a.due}" ${a.paid&&a.tenantUid?'disabled':''}>
 <label for="f_paid">Payment</label><select id="f_paid" ${a.paid&&a.tenantUid?'disabled':''}><option value="0" ${!a.paid?'selected':''}>Not paid</option><option value="1" ${a.paid?'selected':''}>Paid</option></select>${a.paid&&a.tenantUid?'<p class="mut" style="margin:6px 0 0">This payment is recorded and locked. Use Next month for the next bill.</p>':''}
 <div class="row">${id?`<button onclick="nextCycle('${id}')" title="Move due date +1 month and reset to not paid">Next month</button><button onclick="del('${id}')">Delete</button>`:''}<button onclick="closeM()">Cancel</button><button class="p" onclick="saveUnit('${id||''}')">Save</button></div>`)}
const normU=x=>String(x||'').trim().replace(/\s+/g,' ').toLowerCase();
const dupUnit=(id,name)=>S.units.some(x=>x.id!==id&&normU(x.unit)===normU(name));
const checkDup=(id,v)=>{const e=$('#f_dup');if(e)e.textContent=v.trim()&&dupUnit(id,v)?'A unit with this name already exists.':''};
const saveUnit=id=>run(async()=>{const unit=$('#f_unit').value.trim().replace(/\s+/g,' ');if(!unit){alert('Enter a unit name.');return}
 if(dupUnit(id,unit)){alert('Unit "'+unit+'" already exists. Use a different name.');return}
 const old=id?S.units.find(x=>x.id===id):null,locked=!!(old&&old.paid&&old.tenantUid);
 const t=$('#f_ten').value,u=S.users.find(x=>x.id===t);
 const due=locked?old.due:($('#f_due').value||off(30)),wantPaid=locked||$('#f_paid').value==='1';
 const d={unit,tenantUid:t,tenantName:u?u.name:'',rent:+$('#f_rent').value||0,due,paid:t?wantPaid:false};
 const ref=id?doc(db,'units',id):doc(collection(db,'units')),ym=due.slice(0,7),b=writeBatch(db);
 if(d.paid&&!hasPay(ref.id,ym)){if(!confirm('Saving as Paid creates a permanent payment record for '+monthLabel(ym)+'. It cannot be edited or deleted. Continue?'))return;
  b.set(doc(db,'payments',payId(ref.id,ym)),payDoc({...d,id:ref.id},ym))}
 id?b.update(ref,d):b.set(ref,d);
 await b.commit();closeM()});
const nextCycle=id=>run(async()=>{const a=S.units.find(x=>x.id===id),d=new Date(a.due+'T00:00:00');d.setMonth(d.getMonth()+1);await updateDoc(doc(db,'units',id),{due:iso(d),paid:false});closeM()});
const del=id=>run(async()=>{if(confirm('Delete this unit?')){await deleteDoc(doc(db,'units',id));closeM()}});


/* ---- group chat ---- */
const ms=t=>t?.toMillis?.()??0;
const tm=t=>{const d=t?.toDate?.();return d?d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''};
const unread=()=>S.user?S.msgs.filter(m=>m.uid!==S.user.uid&&ms(m.createdAt)>(S.lastRead||0)).length:0;
const unreadBadge=()=>{const n=unread();return n?`<span class="dot">${n>99?'99+':n}</span>`:''};
function tenantNav(pg){return`<nav class="nav">${navBtn(pg,'rent','My rent')}${navBtn(pg,'chat','Group chat',pg==='chat'?'':unreadBadge())}${logoutBtn()}</nav>`}
function ensureChat(){
 if(S.chatOn||!S.user)return;S.chatOn=true;
 unsubs.push(onSnapshot(query(collection(db,'messages'),orderBy('createdAt'),limitToLast(100)),s=>{S.msgs=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));render()},e=>{S.msg=fe(e);render()}));
 unsubs.push(onSnapshot(doc(db,'reads',S.user.uid),s=>{S.lastRead=s.exists()?ms(s.data().lastRead):0;render()},()=>{}));
}
let marking=false;
function markRead(){if(marking)return;marking=true;setDoc(doc(db,'reads',S.user.uid),{lastRead:serverTimestamp()}).catch(()=>{}).finally(()=>setTimeout(()=>marking=false,800))}
function chatView(){
 const me=S.user.uid;
 const items=S.msgs.map(m=>`<div class="msg ${m.uid===me?'me':''}"><div class="mh">${m.fromOwner?'<b class="ow">Owner</b>':`<b>${esc(m.name)}</b>`}<span class="mut">${tm(m.createdAt)}</span>${S.owner?`<button class="x" onclick="delMsg('${m.id}')" aria-label="Delete message">×</button>`:''}</div><div class="mt">${esc(m.text)}</div></div>`).join('');
 return`<div class="card chat"><h2>Group chat</h2><div class="mut">Everyone here is the owner or a verified tenant.</div>
 <div class="log" id="log">${items||'<p class="mut">No messages yet. Say hello.</p>'}</div>
 <div class="compose"><textarea id="m_text" rows="1" maxlength="500" placeholder="Write a message" oninput="S.draft=this.value" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}">${esc(S.draft||'')}</textarea><button class="p" onclick="send()">Send</button></div>
 <div class="err" id="msg">${esc(S.msg)}</div></div>`}
async function send(){
 const t=$('#m_text'),text=t.value.trim();if(!text)return;
 const name=S.owner?'Owner':(S.profile?.name||'');
 t.value='';S.draft='';
 try{await addDoc(collection(db,'messages'),{text,uid:S.user.uid,name,fromOwner:S.owner,createdAt:serverTimestamp()})}
 catch(e){t.value=text;S.draft=text;msg(fe(e))}}
const delMsg=id=>run(async()=>{if(confirm('Delete this message for everyone?'))await deleteDoc(doc(db,'messages',id))});
function render(){
 const had=document.activeElement?.id==='m_text';
 render0();
 const lg=$('#log');if(lg)lg.scrollTop=lg.scrollHeight;
 if(had){const t=$('#m_text');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
 const onChat=!!lg,n=unread();
 document.title=(n?`(${n}) `:'')+'Apartment Billing';
 if(onChat&&n>0&&!document.hidden)markRead();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

/* ---- auth actions ---- */
const google=()=>{const pr=new GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});return signInWithPopup(auth,pr).catch(e=>{if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')msg(fe(e))});}
async function emailAuth(){
 const em=$('#a_email').value.trim(),pw=$('#a_pw').value;if(!em||!pw)return msg('Enter your email and password.');
 try{if(S.tab==='up'){const nm=$('#a_name').value.trim();if(!nm)return msg('Enter your full name.');
   const c=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(c.user,{displayName:nm});sendEmailVerification(c.user).catch(()=>{})}
  else await signInWithEmailAndPassword(auth,em,pw)}catch(e){msg(fe(e))}}
async function forgot(){const em=$('#a_email').value.trim();if(!em)return msg('Type your email first, then tap Forgot password.');
 try{await sendPasswordResetEmail(auth,em);msg('Password reset email sent. Check your inbox.')}catch(e){msg(fe(e))}}
const resend=()=>sendEmailVerification(auth.currentUser).then(()=>msg('Verification email sent.')).catch(e=>msg(fe(e)));
const logout=()=>signOut(auth);
Object.assign(window,{reportPay,submitReport,approveRep,declineRep,checkDup,setQ,setSt,setMonth,shiftMonth,send,delMsg,S,render,page,filt,tab,google,emailAuth,forgot,resend,logout,redo,pickFile,submitVerify,review,approve,decline,edit,saveUnit,nextCycle,del,markPaid,closeM});

</script>
</body>
</html>
