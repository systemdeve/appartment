<title>Apartment Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sab:0;--ink:#1d2227;--mut:#5d6670;--wood:#b8672b;--char:#363b41;--line:rgba(29,34,39,.12);--glass:rgba(255,255,255,.9);
--ok:#16854f;--okb:#dff3e8;--warn:#a96400;--warnb:#fdeccb;--bad:#c72f2f;--badb:#fbdede;--vac:#4f5a68;--vacb:#e6eaef}
*{box-sizing:border-box}
html{background:#2a2118}
body{margin:0;font-family:Manrope,system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:1020px;margin:0 auto;padding:16px}
.hero{min-height:230px;display:flex;flex-direction:column;justify-content:space-between;padding:6px 0 22px;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:8px;background:rgba(20,16,12,.45);backdrop-filter:blur(8px);padding:5px 6px 5px 14px;border-radius:99px;font-size:13px}
h1{font-size:clamp(28px,6vw,46px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.sub{margin:8px 0 0;font-size:15px;opacity:.92;text-shadow:0 1px 8px rgba(0,0,0,.5)}
h2{font-size:17px;margin:0 0 12px;font-weight:800}
.card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
button{font:inherit;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px;transition:background .15s,transform .1s}
button:hover{background:#f1ece6}button:active{transform:scale(.97)}
button.p{background:var(--wood);color:#fff;border-color:var(--wood)}button.p:hover{background:#9f5822}
button.s{padding:6px 11px;font-size:13px}
button.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);padding:5px 12px}button.ghost:hover{background:rgba(255,255,255,.18)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4a8fd6;outline-offset:2px}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--glass);backdrop-filter:blur(12px);border-radius:14px;padding:12px 14px;border-left:5px solid var(--char);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.stat b{font-size:24px;display:block;font-weight:800}.stat span{color:var(--mut);font-size:13px}
.stat.v{border-color:var(--vac)}.stat.o{border-color:var(--bad)}.stat.u{border-color:var(--wood)}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.paid{background:var(--okb);color:var(--ok)}.due,.unpaid{background:var(--warnb);color:var(--warn)}.overdue{background:var(--badb);color:var(--bad)}.vacant,.none{background:var(--vacb);color:var(--vac)}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.door{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.plate{background:var(--char);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;letter-spacing:.04em;border-bottom:4px solid var(--wood)}
.door.s-overdue .plate{border-color:var(--bad)}.door.s-paid .plate{border-color:var(--ok)}.door.s-vacant .plate{border-color:#9aa4b0}
.dbody{padding:12px 14px;flex:1;font-size:14px;line-height:1.7}.dbody .n{font-weight:700;font-size:15px}
.dact{display:flex;gap:6px;padding:0 14px 14px;flex-wrap:wrap}
.banner{border-radius:16px;padding:18px;margin-bottom:14px;font-weight:800;font-size:18px;box-shadow:0 10px 30px rgba(0,0,0,.22);border-left:8px solid}
.banner small{display:block;font-weight:500;font-size:14px;margin-top:5px}
.banner.overdue{border-color:var(--bad)}.banner.due,.banner.unpaid{border-color:var(--warn)}.banner.paid{border-color:var(--ok)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.info span{color:var(--mut);font-size:13px}
.note{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.note:last-child{border:0}
.mut{color:var(--mut);font-size:13px}.foot{color:#fff;opacity:.85;font-size:13px;text-shadow:0 1px 6px #000}
.err{color:var(--bad);font-size:13px;font-weight:700;margin-top:10px}
.login{max-width:390px;margin:0 auto 30px}
.modal{position:fixed;inset:0;background:rgba(15,12,9,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.on{display:flex}.modal .card{width:100%;max-width:430px;max-height:90vh;overflow:auto;margin:0;background:#fff}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);resize:vertical}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:#ece7e1;padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent}.tabs button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px}
.or{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 0}
.prev img,.idimg{display:block;width:100%;max-height:300px;object-fit:contain;background:#0001;border-radius:10px;margin-top:10px}
.idimg{max-height:340px}
.stat.p{border-color:var(--warn)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:500;color:var(--mut);margin:12px 0 0}.chk input{width:auto;margin-top:2px}.rh{margin:16px 0 4px;font-size:14px;font-weight:800}
.reg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.reg:last-child{border:0}.regr{display:flex;align-items:center;gap:8px}
.nav{display:flex;gap:6px;background:rgba(20,16,12,.55);backdrop-filter:blur(10px);padding:6px;border-radius:14px;margin-bottom:14px;position:sticky;top:8px;z-index:3}
.nav button{flex:1;background:transparent;color:#fff;border:0;display:flex;align-items:center;justify-content:center;gap:8px}
.nav button:hover{background:rgba(255,255,255,.14)}.nav button.on{background:#fff;color:var(--ink)}
.dot{background:var(--bad);color:#fff;border-radius:99px;font-size:12px;min-width:20px;padding:1px 6px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{padding:5px 12px;font-size:13px;border-radius:99px}
.chips button.on{background:var(--char);color:#fff;border-color:var(--char)}

/* icon nav */
.nav{align-items:center}
.nav button{position:relative;flex:1;min-height:44px;padding:8px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.nav button .dot{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;font-size:11px;line-height:16px;padding:0 5px}
.nav .sep{width:1px;align-self:stretch;margin:6px 2px;background:rgba(255,255,255,.25)}
.nav button.out{flex:0 0 52px;color:#ffb4b4}
.nav button.out:hover{background:rgba(199,47,47,.55);color:#fff}
.hero{min-height:170px;justify-content:flex-end}

.stat.g{border-color:var(--ok)}.stat small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.srch{position:relative}.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.srch input{padding-left:36px}
.mon{display:flex;gap:6px;align-items:center}.mon input{flex:1;min-width:0}.mon button{padding:8px 12px}
.tools .chips{margin:0}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:18px 0;font-size:14px}
.chat .log{height:min(55vh,430px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:#f1ede8;border-radius:12px;margin:10px 0}
.msg{max-width:85%;background:#fff;border-radius:12px;padding:8px 12px;align-self:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.msg.me{align-self:flex-end;background:#fbe8d6}.mh{display:flex;gap:8px;align-items:center;font-size:12px}
.ow{background:var(--wood);color:#fff;padding:1px 9px;border-radius:99px}
.mt{white-space:pre-wrap;word-break:break-word;font-size:14px;margin-top:3px}
.compose{display:flex;gap:8px;align-items:flex-end}.compose textarea{flex:1}
.x{border:0;background:none;padding:0 4px;font-size:16px;color:var(--mut)}

/* ===== modern minimal theme ===== */
:root{--ink:#16181d;--mut:#6b7280;--wood:#e8590c;--char:#16181d;--line:rgba(22,24,29,.08);--glass:#fff;--bgc:#f6f5f2;--ok:#12805c;--okb:#e3f5ee;--warn:#b25e09;--warnb:#fdf0dc;--bad:#d1383d;--badb:#fde8e8;--vac:#6b7280;--vacb:#eceef1;--r:18px;--sh:0 1px 2px rgba(22,24,29,.04),0 8px 24px rgba(22,24,29,.06);--ez:cubic-bezier(.2,.8,.2,1)}

.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,18,12,.05) 0,rgba(24,18,12,.35) 38%,rgba(24,18,12,.82) 100%)}
.wrap{padding:20px 16px 56px}
.hero{min-height:210px;justify-content:space-between;padding:6px 0 22px;color:#fff}
h1{font-size:clamp(30px,5.5vw,44px);letter-spacing:-.035em;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.sub{color:#fff;opacity:.92;text-shadow:0 1px 8px rgba(0,0,0,.5)}.foot{color:#fff;text-shadow:0 1px 6px #000}
.card,.banner{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card{padding:20px}.banner{border-left-width:6px}
button{border-radius:12px;font-weight:600;transition:background .2s,transform .2s var(--ez),box-shadow .2s}
button:hover{background:#f1f0ec;transform:translateY(-1px)}button:active{transform:scale(.97)}
button.p{background:var(--ink);border-color:var(--ink);color:#fff}button.p:hover{background:#2c3038}
input,select,textarea{border-radius:12px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(22,24,29,.08)}
.nav{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--sh);border-radius:16px;gap:4px}
.nav button{color:var(--mut);border-radius:12px}.nav button:hover{background:#f1f0ec;color:var(--ink)}
.nav button.on{background:var(--ink);color:#fff}.nav .sep{background:var(--line)}
.nav button.out{color:var(--bad)}.nav button.out:hover{background:var(--badb);color:var(--bad)}
.stat,.stat.v,.stat.o,.stat.u,.stat.p,.stat.g{background:#fff;backdrop-filter:none;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);position:relative;padding:14px 16px;transition:transform .25s var(--ez),box-shadow .25s}
.stat:hover{transform:translateY(-2px)}.stat b{font-size:26px;letter-spacing:-.02em}
.stat::before{content:"";position:absolute;top:16px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.stat.v::before{background:var(--vac)}.stat.o::before{background:var(--bad)}.stat.u::before{background:var(--wood)}.stat.p::before{background:var(--warn)}.stat.g::before{background:var(--ok)}
.door{border-radius:16px;box-shadow:var(--sh);transition:transform .25s var(--ez),box-shadow .25s}
.door:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(22,24,29,.10)}
.plate{background:#fff;color:var(--ink);border-bottom-width:3px;font-size:17px}
.tabs,.chips button{background:#efeee9}.chips button{border-color:transparent}.chips button.on,.tabs button.on{color:#fff}
.tabs button.on{background:var(--ink)}.chat .log{background:#f6f5f2}.msg.me{background:#fdece0}
.modal{background:rgba(22,24,29,.45);backdrop-filter:blur(4px)}
.modal.on{animation:fade .2s}.modal.on .card{animation:pop .3s var(--ez)}
/* motion */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shim{to{background-position:-200% 0}}
.anim>*{animation:up .5s var(--ez) both}
.anim>*:nth-child(2){animation-delay:.06s}.anim>*:nth-child(3){animation-delay:.12s}.anim>*:nth-child(4){animation-delay:.18s}.anim>*:nth-child(n+5){animation-delay:.24s}
.anim .door,.anim .stat{animation:up .45s var(--ez) both}
.anim .door:nth-child(2),.anim .stat:nth-child(2){animation-delay:0.10s}.anim .door:nth-child(3),.anim .stat:nth-child(3){animation-delay:0.15s}.anim .door:nth-child(4),.anim .stat:nth-child(4){animation-delay:0.20s}.anim .door:nth-child(5),.anim .stat:nth-child(5){animation-delay:0.25s}.anim .door:nth-child(6),.anim .stat:nth-child(6){animation-delay:0.30s}.anim .door:nth-child(7),.anim .stat:nth-child(7){animation-delay:0.35s}.anim .door:nth-child(8),.anim .stat:nth-child(8){animation-delay:0.40s}
.skl{height:14px;border-radius:8px;margin:12px 0;background:linear-gradient(90deg,#eceae5 25%,#f6f5f2 50%,#eceae5 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
/* loading screen */
#loader{position:fixed;inset:0;z-index:99;background:var(--bgc);display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#loader.off{opacity:0;visibility:hidden}.ld{text-align:center}
.ldi{width:64px;height:64px;border-radius:20px;background:var(--ink);display:grid;place-items:center;margin:0 auto 16px;animation:float 1.6s ease-in-out infinite;box-shadow:0 14px 30px rgba(22,24,29,.25)}
.ldi svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ldn{font-weight:800;letter-spacing:-.02em;font-size:18px}
.ldb{width:120px;height:3px;border-radius:9px;background:#e4e2dc;margin:14px auto 0;overflow:hidden}
.ldb i{display:block;width:40%;height:100%;background:var(--wood);border-radius:9px;animation:bar 1.1s ease-in-out infinite}

/* toasts, confirm dialog, groups */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,380px);pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bgc);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .3s var(--ez);transition:opacity .25s,transform .25s}
.toast.out{opacity:0;transform:translateY(8px)}.toast i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.toast.err i{background:var(--bad)}.toast.warn i{background:var(--warn)}
#dlg{z-index:8}
.grp h3{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 10px;display:flex;gap:8px;align-items:center}.grp:first-child h3{margin-top:4px}
.grp h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--vac)}
.grp h3.g-overdue::before{background:var(--bad)}.grp h3.g-due::before,.grp h3.g-unpaid::before{background:var(--wood)}.grp h3.g-paid::before{background:var(--ok)}
.grp h3 span{background:var(--vacb);border-radius:99px;padding:1px 8px;font-size:12px;color:var(--ink)}
.err:empty{display:none}
/* dark mode */
:root[data-theme=dark]{color-scheme:dark;--ink:#ecedf0;--mut:#9aa1ad;--line:rgba(255,255,255,.10);--glass:#1c1f26;--bgc:#101216;--char:#ecedf0;--ok:#3ec28f;--okb:rgba(62,194,143,.16);--warn:#f0a53c;--warnb:rgba(240,165,60,.16);--bad:#ff7478;--badb:rgba(255,116,120,.16);--vac:#9aa1ad;--vacb:rgba(255,255,255,.08);--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
[data-theme=dark] .card,[data-theme=dark] .modal .card,[data-theme=dark] .stat,[data-theme=dark] .stat.v,[data-theme=dark] .stat.o,[data-theme=dark] .stat.u,[data-theme=dark] .stat.p,[data-theme=dark] .stat.g,[data-theme=dark] .door,[data-theme=dark] .plate,[data-theme=dark] .banner{background:#1c1f26}
[data-theme=dark] button{background:#242831;color:var(--ink)}[data-theme=dark] button:hover{background:#2d323c}
[data-theme=dark] button.p,[data-theme=dark] .nav button.on,[data-theme=dark] .tabs button.on,[data-theme=dark] .chips button.on{background:#ecedf0;color:#16181d;border-color:#ecedf0}
[data-theme=dark] button.p:hover{background:#fff}
[data-theme=dark] .nav{background:rgba(28,31,38,.82)}[data-theme=dark] .nav button{background:transparent;color:var(--mut)}[data-theme=dark] .nav button:hover{background:rgba(255,255,255,.08);color:var(--ink)}
[data-theme=dark] .nav button.on:hover{background:#fff;color:#16181d}[data-theme=dark] .nav button.out{color:var(--bad)}[data-theme=dark] .nav button.out:hover{background:var(--badb)}
[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea{background:#14171c;color:var(--ink)}
[data-theme=dark] input:focus,[data-theme=dark] select:focus,[data-theme=dark] textarea:focus{box-shadow:0 0 0 4px rgba(255,255,255,.12)}
[data-theme=dark] .tabs,[data-theme=dark] .chips button{background:#242831}[data-theme=dark] .tabs button{background:transparent}[data-theme=dark] .chips button.on{background:#ecedf0}
[data-theme=dark] .chat .log{background:#14171c}[data-theme=dark] .msg{background:#242831}[data-theme=dark] .msg.me{background:#3a2a1e}
[data-theme=dark] .modal{background:rgba(0,0,0,.6)}
[data-theme=dark] .bg::after{background:linear-gradient(180deg,rgba(8,10,14,.45) 0,rgba(8,10,14,.7) 38%,rgba(8,10,14,.92) 100%)}
[data-theme=dark] .skl{background:linear-gradient(90deg,#242831 25%,#2d323c 50%,#242831 75%);background-size:200% 100%}
[data-theme=dark] .ldi{background:#ecedf0}[data-theme=dark] .ldi svg{stroke:#16181d}[data-theme=dark] .ldb{background:#2d323c}

/* floating install button */
#fab{position:fixed;right:12px;bottom:96px;z-index:4;touch-action:none;user-select:none;-webkit-user-select:none;animation:pop .5s var(--ez);transition:left .25s var(--ez),top .2s}
#fab[hidden]{display:none}#fab.drag{transition:none}
#fab .fb{display:flex;align-items:center;gap:8px;padding:12px 18px 12px 14px;border-radius:99px;border:0;color:#fff;font-weight:800;font-size:14px;background:linear-gradient(135deg,#ff8a3d,#e8590c);box-shadow:0 10px 28px rgba(232,89,12,.45),0 2px 6px rgba(0,0,0,.25);cursor:grab;position:relative;touch-action:none}
#fab.drag .fb{cursor:grabbing}
#fab .fb:hover{background:linear-gradient(135deg,#ff9650,#f0620f);transform:none}
#fab .fb svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;animation:nudge 1.6s ease-in-out infinite}
#fab .fb::after{content:"";position:absolute;inset:0;border-radius:99px;border:2px solid rgba(232,89,12,.65);animation:ring 1.8s ease-out infinite;pointer-events:none}

}

 --ink:#f3f5fc;--mut:#b9c0d4;--line:rgba(255,255,255,.14);
 --gl:rgba(18,21,40,.46);--gl2:rgba(255,255,255,.08);--gl3:rgba(18,21,40,.72);
 --gb:rgba(255,255,255,.18);--gh:rgba(255,255,255,.28);--pill:rgba(255,255,255,.16);--msg:rgba(255,255,255,.1);
 --gsh:0 10px 36px rgba(0,0,0,.5);
 --ok:#4fd6a0;--okb:rgba(52,211,153,.2);--warn:#f6b04c;--warnb:rgba(245,158,11,.22);--bad:#ff8a8e;--badb:rgba(248,113,113,.22);--vac:#b9c0d4;--vacb:rgba(255,255,255,.1);
 --fb:#a5b1ff;--fbi:#b9c0d4;--fbh:rgba(255,255,255,.1);--fbg:rgba(255,255,255,.1)
}
html{background:#14112e}

/* --- colourful backdrop the glass refracts --- */
.bg{overflow:hidden;filter:saturate(1.15)}
.bg::after{z-index:0;background:linear-gradient(160deg,rgba(88,40,170,.55) 0%,rgba(30,27,75,.5) 48%,rgba(140,56,20,.55) 100%)}
:root[data-theme=dark] .bg::after{background:linear-gradient(160deg,rgba(20,10,52,.82) 0%,rgba(8,10,28,.84) 50%,rgba(42,16,10,.86) 100%)}
.bg::before{content:"";position:absolute;inset:-12%;z-index:1;pointer-events:none;
 background:radial-gradient(40vmax 40vmax at 14% 8%,rgba(124,92,255,.55),transparent 62%),radial-gradient(34vmax 34vmax at 92% 22%,rgba(255,122,47,.42),transparent 62%),radial-gradient(44vmax 44vmax at 68% 96%,rgba(236,72,153,.4),transparent 62%);
 animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-3%,3%,0) scale(1.08)}}

/* --- glass panels --- */
:root:root .card,:root:root .banner,:root:root .stat,:root:root .modal .card{
 background:var(--gl);color:var(--ink);
 -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
 border:1px solid var(--gb);border-radius:var(--r);
 box-shadow:var(--gsh),inset 0 1px 0 var(--gh),inset 0 0 0 1px rgba(255,255,255,.05)}
:root:root .modal .card{background:var(--gl3)}
:root:root .stat{border-radius:18px}

:root:root .banner.overdue{background:linear-gradient(var(--badb),var(--badb)),var(--gl)!important;border-left-color:var(--bad)}
:root:root .banner.due,:root:root .banner.unpaid{background:linear-gradient(var(--warnb),var(--warnb)),var(--gl)!important;border-left-color:var(--warn)}
:root:root .door{background:var(--gl2);color:var(--ink);border:1px solid var(--gb);border-radius:18px;box-shadow:0 6px 20px rgba(20,16,60,.16),inset 0 1px 0 var(--gh)}

.stat b,.door .n,h2{color:var(--ink)}

:root:root button{background:var(--gl2);color:var(--ink);border:1px solid var(--gb);
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 box-shadow:0 2px 10px rgba(20,16,60,.14),inset 0 1px 0 var(--gh)}
:root:root button:hover{background:var(--gl3)}
:root:root button.p{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:rgba(255,255,255,.4);

:root:root button.p:hover{filter:brightness(1.08);background:linear-gradient(135deg,var(--g1),var(--g2))}

:root:root .tabs{background:var(--gl2);border:1px solid var(--gb);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* --- top bar: full-width frosted glass --- */

:root:root textarea{min-height:84px;resize:vertical}
#offl{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:60;max-width:calc(100% - 32px);padding:12px 18px;border-radius:16px;font:600 13px Arial,sans-serif;color:#fff;background:rgba(190,40,50,.55);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .35s var(--ez)}
#offl.on{transform:translate(-50%,0)}

/* --- ID vs selfie comparison --- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.cmp figure{margin:0;text-align:center}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:contain;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid var(--gb)}
.cmp figcaption{font-size:12px;color:var(--mut);margin-top:4px}

/* --- house logo: loading screen, intro, hero logo --- */
:root:root .ldi{width:132px;height:132px;border-radius:0;background:none;border:0;box-shadow:none;animation:logoIn .9s cubic-bezier(.2,.9,.3,1.2) both,float 2.2s ease-in-out .9s infinite}
.ldi img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 24px rgba(0,0,0,.45))}
:root:root .ldn{font-size:22px;animation:up .7s ease .5s both}
.ldt{font-size:13px;opacity:.8;margin-top:4px;animation:up .7s ease .8s both}
.ldb{animation:fade .5s ease 1s both}
@keyframes logoIn{0%{opacity:0;transform:scale(.4) translateY(30px) rotate(-6deg)}100%{opacity:1;transform:none}}
.hlogo{width:clamp(44px,9vw,64px);height:clamp(44px,9vw,64px);object-fit:contain;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));animation:pop .6s ease both}
.htitle{display:flex;align-items:center;gap:12px}
@media(prefers-reduced-motion:reduce){:root:root .ldi,.ldn,.ldt,.ldb{animation:none!important}}
</style>
</head>

/* ---- status helpers ---- */
const vacant=a=>!a.tenantUid;
const days=a=>Math.round((new Date(a.due+'T00:00:00')-new Date(iso(new Date())+'T00:00:00'))/864e5);
const status=a=>{if(vacant(a))return'vacant';if(a.paid)return'paid';const d=days(a);return d<0?'overdue':d<=3?'due':'unpaid'};
const lateDays=a=>Math.max(0,-days(a));
const late=a=>!vacant(a)&&!a.paid&&Number(a.lateFee)>0&&lateDays(a)>(Number(a.grace)||0)?Number(a.lateFee):0;
const owed=a=>(Number(a.rent)||0)+late(a);

 onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];Object.assign(S,{user:u,ready:false,profile:null,unit:null,users:[],units:[],pays:[],reps:[],redo:false,msg:'',idData:'',selfie:'',mt:[],msgs:[],lastRead:0,chatOn:false,page:null,draft:''});
  S.owner=!!u&&u.emailVerified&&OWNER_EMAILS.includes((u.email||'').toLowerCase());
  if(!u||(!S.owner&&OWNER_EMAILS.includes((u.email||'').toLowerCase()))){S.ready=true;return render()}
  const bad=e=>{S.ready=true;S.msg=fe(e);render()};
  if(S.owner){
   unsubs.push(onSnapshot(collection(db,'users'),s=>{S.users=s.docs.map(d=>({id:d.id,...d.data()}));render()},bad));
   unsubs.push(onSnapshot(collection(db,'paymentReports'),s=>{S.reps=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));render()},bad));
   unsubs.push(onSnapshot(collection(db,'payments'),s=>{S.pays=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));render()},bad));
   unsubs.push(onSnapshot(collection(db,'units'),s=>{S.units=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.unit.localeCompare(b.unit,undefined,{numeric:true}));S.ready=true;render()},bad));
   unsubs.push(onSnapshot(collection(db,'maintenance'),s=>{S.mt=s.docs.map(d=>({id:d.id,...d.data()}));render()},bad));
   ensureChat();
  }else{
   unsubs.push(onSnapshot(doc(db,'users',u.uid),s=>{S.profile=s.exists()?s.data():null;S.ready=true;if(S.profile?.status==='approved')ensureChat();render()},bad));
   unsubs.push(onSnapshot(query(collection(db,'paymentReports'),where('tenantUid','==',u.uid)),s=>{S.reps=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));render()},bad));
   unsubs.push(onSnapshot(query(collection(db,'payments'),where('tenantUid','==',u.uid)),s=>{S.pays=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));render()},bad));

   unsubs.push(onSnapshot(query(collection(db,'maintenance'),where('tenantUid','==',u.uid)),s=>{S.mt=s.docs.map(d=>({id:d.id,...d.data()}));render()},bad));
  }

function compress(file,max=1000,lim=900000){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('Could not read the file.'));
 r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Choose a JPG or PNG photo.'));
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   let q=.72,o;do{o=c.toDataURL('image/jpeg',q);q-=.1}while(o.length>lim&&q>.2);res(o)};im.src=r.result};r.readAsDataURL(file)})}
async function pickFile(el){const f=el.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>15e6){msg('Choose a JPG or PNG photo under 15 MB.');return}
 try{S.idData=await compress(f);msg('');$('#prev').innerHTML=`<img src="${S.idData}" alt="ID preview">`}catch(e){msg(e.message)}}
async function pickSelfie(el){const f=el.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>15e6){msg('Choose a photo under 15 MB.');return}
 try{S.selfie=await compress(f,700,150000);msg('');$('#sprev').innerHTML=`<img src="${S.selfie}" alt="Selfie preview">`}catch(e){msg(e.message)}}
async function submitVerify(){
 const name=$('#v_name').value.trim();
 if(!name)return msg('Enter your full name as shown on your ID.');
 const ph=normPh($('#v_phone').value);if(!ph)return msg('Enter a valid Philippine mobile number, e.g. 0917 123 4567.');
 if(!S.idData)return msg('Upload a clear photo of your ID.');
 if(!S.selfie)return msg('Take a selfie so the owner can compare it with your ID.');
 if(!$('#v_ok').checked)return msg('Please agree to the privacy notice to continue.');
 const btn=$('#v_btn');btn.disabled=true;btn.textContent='Submitting…';
 try{const uid=S.user.uid,mk=withPh=>{const b=writeBatch(db);
  b.set(doc(db,'ids',uid),{image:S.idData,consentAt:serverTimestamp(),updatedAt:serverTimestamp()});
  b.set(doc(db,'selfies',uid),{image:S.selfie,createdAt:serverTimestamp()});
  b.set(doc(db,'users',uid),{name,email:S.user.email||'',idType:$('#v_type').value,status:'pending',reason:'',submittedAt:serverTimestamp(),...(withPh?{phone:ph}:{})});
  return b};
  // if your Firestore rules do not allow the phone field yet, register without it (owner can add the number)
  try{await mk(true).commit()}catch(e){if(e.code!=='permission-denied')throw e;await mk(false).commit()}
  S.idData='';S.selfie='';S.redo=false;S.msg=''}catch(e){btn.disabled=false;btn.textContent='Submit for review';msg(fe(e))}}
function tenantView(a){

 <div class="card">${doorPic(a,"big")}<h2>Unit ${esc(a.unit)}</h2><div class="info"><div><span>Tenant</span><br><b>${esc(a.tenantName)}</b></div><div><span>Monthly rent</span><br><b>${money(a.rent)}</b></div><div><span>Due date</span><br><b>${fmt(a.due)}</b></div><div><span>Status</span><br>${badge(s)}</div></div></div>
 `,N=`<div class="card"><h2>Notifications</h2><div class="note">${badge(s)} ${n}</div>${remFeed(a)}${payNotes()}${repNotes()}<p class="mut" style="margin:10px 0 0">Your property owner updates payment status.</p></div>`;

function payHistory(a,s){
 const H={};
 Object.entries(a.payments||{}).forEach(([k,v])=>{const ym=k.slice(1,5)+'-'+k.slice(5);H[ym]={s:'paid',amt:Number(v)}});
 S.pays.forEach(p=>{H[p.month]={s:'paid',amt:Number(p.amount),at:p.paidAt?iso(new Date(ms(p.paidAt))):''}});
 const cur=(a.due||'').slice(0,7);
 if(cur&&!H[cur])H[cur]={s,amt:Number(a.rent)||0,due:a.due};
 const rows=Object.entries(H).sort((x,y)=>y[0].localeCompare(x[0]));

   d.refs.slice(i,i+100).forEach(r=>r.f?b.update(doc(db,r.c,r.id),{[r.f]:deleteField()}):b.delete(doc(db,r.c,r.id)));
   await b.commit();n=Math.min(i+100,d.refs.length);S.bk.msg=`Deleted ${n} of ${d.n}…`;bkMsg()}
  S.bk.msg=`Deleted ${n} photo${n===1?'':'s'}. The usage numbers in the Firebase console can take a while to update.`;toast('Photos deleted');S.bk.done=null}
 catch(e){S.bk.msg=`Stopped after ${n} of ${d.n}: ${fe(e)}`;S.bk.done=null}
 finally{S.bk.busy=false;render()}});
/* ---- group chat ---- */
const ms=t=>t?.toMillis?.()??0;
const tm=t=>{const d=t?.toDate?.();return d?d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''};
const unread=()=>S.user?S.msgs.filter(m=>m.uid!==S.user.uid&&ms(m.createdAt)>(S.lastRead||0)).length:0;
const unreadBadge=()=>{const n=unread();return n?`<span class="dot">${n>99?'99+':n}</span>`:''};
const alertDot=()=>(S.unit&&['overdue','due'].includes(status(S.unit)))||S.reps.some(r=>r.status==='declined')?'<span class="dot">!</span>':'';
function tenantNav(pg){return`<nav class="nav">${navBtn(pg,'rent','My rent')}${navBtn(pg,'history','Payment history')}${navBtn(pg,'notif','Notifications',pg==='notif'?'':alertDot())}${navBtn(pg,'chat','Group chat',pg==='chat'?'':unreadBadge())}${logoutBtn()}</nav>`}
function ensureChat(){
 if(S.chatOn||!S.user)return;S.chatOn=true;
 unsubs.push(onSnapshot(query(collection(db,'messages'),orderBy('createdAt'),limitToLast(100)),s=>{S.msgs=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));render()},e=>{S.msg=fe(e);render()}));
 unsubs.push(onSnapshot(doc(db,'reads',S.user.uid),s=>{S.lastRead=s.exists()?ms(s.data().lastRead):0;render()},()=>{}));
}
let marking=false;
function markRead(){if(marking)return;marking=true;setDoc(doc(db,'reads',S.user.uid),{lastRead:serverTimestamp()}).catch(()=>{}).finally(()=>setTimeout(()=>marking=false,800))}
function chatView(){
 const me=S.user.uid;
 const items=S.msgs.map(m=>`<div class="msg ${m.uid===me?'me':''}"><div class="mh">${m.fromOwner?'<b class="ow">Owner</b>':`<b>${esc(m.name)}</b>`}<span class="mut">${tm(m.createdAt)}</span>${S.owner?`<button class="x" onclick="delMsg('${m.id}')" aria-label="Delete message">×</button>`:''}</div><div class="mt">${esc(m.text)}</div></div>`).join('');
 return`<div class="card chat"><h2>Group chat</h2><div class="mut">Everyone here is the owner or a verified tenant.</div>
 <div class="log" id="log">${items||'<p class="mut">No messages yet. Say hello.</p>'}</div>
 <div class="compose"><textarea id="m_text" rows="1" maxlength="500" placeholder="Write a message" oninput="S.draft=this.value" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}">${esc(S.draft||'')}</textarea><button class="p" onclick="send()">Send</button></div>
 <div class="err" id="msg">${esc(S.msg)}</div></div>`}
async function send(){
 const t=$('#m_text'),text=t.value.trim();if(!text)return;
 const name=S.owner?'Owner':(S.profile?.name||'');
 t.value='';S.draft='';
 try{await addDoc(collection(db,'messages'),{text,uid:S.user.uid,name,fromOwner:S.owner,createdAt:serverTimestamp()})}
 catch(e){t.value=text;S.draft=text;msg(fe(e))}}
const delMsg=id=>run(async()=>{if(await ask('Delete message','This removes it for everyone.','Delete'))await deleteDoc(doc(db,'messages',id))});
function render(){
 const had=document.activeElement?.id==='m_text';
 render0();
 const lg=$('#log');if(lg)lg.scrollTop=lg.scrollHeight;
 if(had){const t=$('#m_text');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
 const onChat=!!lg,n=unread();
 document.title=(n?`(${n}) `:'')+'Apartment Management System';
 if(onChat&&n>0&&!document.hidden)markRead();
 remind();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

/* ---- auth actions ---- */
const google=()=>{if(/FBAN|FBAV|Instagram|Messenger|Line\/|; wv\)/i.test(navigator.userAgent)){msg('Google sign-in does not work inside this app. Open the page in Chrome or Safari, or use email and password.');return}const pr=new GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});return signInWithPopup(auth,pr).catch(e=>{if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')msg(fe(e))});}
async function emailAuth(){
 const em=$('#a_email').value.trim(),pw=$('#a_pw').value;if(!em||!pw)return msg('Enter your email and password.');
 try{if(S.tab==='up'){const nm=$('#a_name').value.trim();if(!nm)return msg('Enter your full name.');
   const c=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(c.user,{displayName:nm});sendEmailVerification(c.user).catch(()=>{})}
  else await signInWithEmailAndPassword(auth,em,pw)}catch(e){msg(fe(e))}}
async function forgot(){const em=$('#a_email').value.trim();if(!em)return msg('Type your email first, then tap Forgot password.');
 try{await sendPasswordResetEmail(auth,em);msg('Password reset email sent. Check your inbox.')}catch(e){msg(fe(e))}}
const resend=()=>sendEmailVerification(auth.currentUser).then(()=>msg('Verification email sent.')).catch(e=>msg(fe(e)));
const logout=()=>signOut(auth);
/* ---- maintenance requests ---- */
const MT_ST={open:'Open',doing:'In progress',fixed:'Fixed'},MT_NEXT={open:'doing',doing:'fixed'};
const mtSorted=()=>(S.mt||[]).slice().sort((x,y)=>ms(y.createdAt)-ms(x.createdAt));
const mtRow=(r,own)=>`<div class="reg"><div><b>${esc(r.title)}</b><br><span class="mut">${r.unit?'Unit '+esc(r.unit)+' · ':''}${esc(r.desc||'')}</span>${okImg(r.photo)?`<br><button class="s" onclick="viewMaint('${r.id}')">Photo</button>`:''}</div><div class="regr"><span class="badge">${MT_ST[r.status]||'Open'}</span>${own&&MT_NEXT[r.status]?`<button class="s p" onclick="mtNext('${r.id}')">Mark ${MT_ST[MT_NEXT[r.status]].toLowerCase()}</button>`:''}</div></div>`;
const maintCard=()=>`<div class="card"><div class="head"><h2 style="margin:0">Maintenance</h2><button class="p s" onclick="newMaint()">Report a problem</button></div>${mtSorted().map(r=>mtRow(r,false)).join('')||'<p class="mut" style="margin:0">No requests yet.</p>'}</div>`;
const maintOwner=()=>{const o=mtSorted().filter(r=>r.status!=='fixed');return o.length?`<div class="card"><h2>Maintenance requests <span class="badge">${o.length}</span></h2>${o.map(r=>mtRow(r,true)).join('')}</div>`:''};
function newMaint(){S.mtPhoto='';openM(`<h2>Report a problem</h2><label for="m_t">What is wrong?</label><input id="m_t" maxlength="80" placeholder="e.g. Leaking faucet"><label for="m_d">Details (optional)</label><textarea id="m_d" maxlength="500" rows="3"></textarea><label for="m_f">Photo (optional)</label><input id="m_f" type="file" accept="image/*" onchange="pickMaint(this)"><div id="m_p" class="prev"></div><div class="err" id="m_e"></div><div class="row"><button onclick="closeM()">Cancel</button><button class="p" onclick="submitMaint()">Send</button></div>`)}
async function pickMaint(el){const f=el.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>15e6){formErr('m_e','Choose a JPG or PNG photo under 15 MB.');el.value='';return}
 try{S.mtPhoto=await compress(f,900,200000);formErr('m_e','');$('#m_p').innerHTML=`<img src="${S.mtPhoto}" alt="Preview">`}catch(e){formErr('m_e',e.message)}}
const submitMaint=()=>run(async()=>{const t=$('#m_t').value.trim();if(!t||!S.unit){formErr('m_e','Say what is wrong.','m_t');return}
 const d={unitId:S.unit.id,unit:S.unit.unit,tenantUid:S.user.uid,tenantName:S.unit.tenantName||'',title:t,desc:$('#m_d').value.trim(),status:'open',createdAt:serverTimestamp()};
 if(S.mtPhoto)d.photo=S.mtPhoto;const b=writeBatch(db);b.set(doc(collection(db,'maintenance')),d);await b.commit();closeM();toast('Request sent to the owner')});
const mtNext=id=>run(async()=>{const r=(S.mt||[]).find(x=>x.id===id);if(!r||!MT_NEXT[r.status])return;await updateDoc(doc(db,'maintenance',id),{status:MT_NEXT[r.status],updatedAt:serverTimestamp()})});
const viewMaint=id=>{const r=(S.mt||[]).find(x=>x.id===id);if(!r||!okImg(r.photo))return;openM(`<h2>${esc(r.title)}</h2><img class="idimg" src="${r.photo}" alt="Problem photo"><div class="row"><button onclick="closeM()">Close</button></div>`)};
/* ---- privacy notice + offline banner ---- */
const showPrivacy=()=>openM(`<h2>Privacy notice</h2><p class="mut" style="margin-top:0">Under the Philippine Data Privacy Act (RA 10173):</p><p><b>What we collect:</b> your name, email, mobile number, ID type and a photo of your government ID, a live selfie that the owner compares with your ID (it is deleted once the owner decides), plus rent and payment records, receipts you upload and chat messages.</p><p><b>Why:</b> to verify who you are, link you to your unit, record rent payments, and contact you about rent.</p><p><b>Who can see it:</b> only you and the property owner. Your ID photo is not shown to other tenants.</p><p><b>How long:</b> the owner keeps it while you are a tenant and deletes your ID photo after your tenancy ends, unless the law requires otherwise. Payment records are kept as permanent receipts.</p><p><b>Your rights:</b> you may ask the owner to see, correct or delete your data.</p><div class="row"><button class="p" onclick="closeM()">Close</button></div>`);
const net=()=>{let b=$('#offl');if(!b){b=document.createElement('div');b.id='offl';b.setAttribute('role','status');b.textContent='You are offline. Changes will sync when you reconnect.';document.body.appendChild(b)}b.classList.toggle('on',!navigator.onLine)};
addEventListener('online',net);addEventListener('offline',net);net();
Object.assign(window,{bkOpt,bkMonths,bkDownload,bkDelete,smsRem,mailRem,copyRem,setAutoChat,pickSelfie,newMaint,pickMaint,submitMaint,mtNext,viewMaint,showPrivacy,pickUnitPhoto,rmUnitPhoto,viewUnit,showReceipt,printReceipt,exportCsv,printReport,receipt,viewProof,pickProof,enableReminders,showFab,toggleTheme,installApp,reportPay,submitReport,approveRep,declineRep,checkDup,setQ,setSt,setMonth,shiftMonth,send,delMsg,S,render,page,filt,tab,google,emailAuth,forgot,resend,logout,redo,pickFile,submitVerify,review,approve,decline,edit,saveUnit,nextCycle,del,markPaid,closeM});
